<?xml version="1.0" encoding="UTF-8"?>
<!--
  Nanuk — wordmark. Blanco, grande, con seguridad. Una sola línea de hielo
  (#9fd8ff) debajo: el horizonte del ártico. Y sobre el horizonte, pequeño,
  el guiño: un oso polar caminando (Nanuk = "oso polar" en inuit).
  Fuente: iA Writer Quattro S Bold (debe estar instalada al renderizar; ver
  build-assets.sh). La misma imagen sirve para el splash y para hyprlock.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="380" viewBox="0 0 1400 380">
  <text x="700" y="248"
        text-anchor="middle"
        font-family="iA Writer Quattro S, sans-serif"
        font-weight="700"
        font-size="240"
        letter-spacing="40"
        fill="#ffffff">NANUK</text>
  <rect x="330" y="300" width="740" height="8" fill="#9fd8ff"/>
  <!-- Oso polar: silueta de 160x80 escalada a 0.6 (96x48), con las patas
       apoyadas en el borde superior de la línea de hielo, al extremo derecho. -->
  <g transform="translate(972 253.2) scale(0.6)">
    <g fill="#ffffff">
      <path d="M 36 62 C 22 54, 24 30, 50 26 C 66 22, 90 20, 104 22 C 114 24, 126 32, 136 40 C 144 37, 154 42, 158 50 C 160 55, 157 59, 151 59 L 140 58 C 134 57, 128 52, 124 46 C 121 50, 118 54, 116 62 Z"/>
      <circle cx="137" cy="40" r="3.5"/>
      <rect x="40" y="56" width="12" height="22" rx="5"/>
      <rect x="57" y="58" width="11" height="20" rx="5"/>
      <rect x="96" y="58" width="11" height="20" rx="5"/>
      <rect x="108" y="56" width="12" height="22" rx="5"/>
    </g>
    <circle cx="147" cy="48" r="2" fill="#000000"/>
  </g>
</svg>
