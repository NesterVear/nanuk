# Nanuk — paleta fuente del tema.
#
# Regla: NEGRO + BLANCO + GRISES. El acento (hielo, #9fd8ff) aparece SOLO
# donde hay "foco": el borde de la ventana activa, el cursor de texto, y la
# línea del lock / splash de arranque. En ningún otro sitio.
#
# Forma: densidad ESTRICTA. gaps 0, bordes de 1 px, radio 0, sin sombras
# ni blur. Ventana activa: borde hielo; inactiva: #1a1a1a (casi invisible,
# solo una costura entre ventanas).
#
# Los colores ANSI de la terminal son grises con un tinte mínimo, lo justo
# para distinguir un `+` de un `-` en un diff de git sin romper el B&N.

mode = "dark"

accent = "#9fd8ff"        # hielo — SOLO foco (ver regla arriba)
selection = "#1e1e1e"     # selección de texto: gris, no azul
muted = "#707070"

background = "#000000"
dark_background = "#080808"
darker_background = "#050505"
lighter_background = "#141414"

foreground = "#ffffff"
dark_foreground = "#5a5a5a"
light_foreground = "#d8d8d8"
bright_foreground = "#ffffff"

# ANSI: grises con tinte mínimo.
red = "#b0a0a0"
yellow = "#b0b0a0"
orange = "#b0a89c"
green = "#a0b0a0"
cyan = "#a0b0b0"
blue = "#a0a8b0"
magenta = "#b0a0b0"
brown = "#5a5a5a"

bright_red = "#c8b8b8"
bright_yellow = "#c8c8b8"
bright_green = "#b8c8b8"
bright_cyan = "#b8c8c8"
bright_blue = "#b8c0c8"
bright_magenta = "#c8b8c8"
