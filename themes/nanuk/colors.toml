# Nanuk — paleta fuente del tema.
# Negro absoluto, blanco, y UN acento: hielo. Todo lo demás son grises.
# Los colores ANSI de terminal llevan un tinte muy suave para que diffs,
# errores y warnings se distingan sin romper la sobriedad. Si prefieres
# grises puros (como Vantablack), iguala red/green/yellow/magenta a muted.
#
# Hoy cada app tiene estos valores copiados a mano (waybar/style.css,
# foot/foot.ini, ...). En Fase 3/5 se generan desde aquí con plantillas.

mode = "dark"

accent = "#9fd8ff"      # hielo
selection = "#10202a"   # hielo muy oscuro, para selección de texto
muted = "#7a7a7a"

background = "#000000"
dark_background = "#090909"
darker_background = "#070707"
lighter_background = "#141414"

foreground = "#ffffff"
dark_foreground = "#505050"
light_foreground = "#ececec"
bright_foreground = "#ffffff"

red = "#d19a9a"
yellow = "#d6cba0"
orange = "#cdb59a"
green = "#a7c4a0"
cyan = "#8ec9e8"
blue = "#9fd8ff"
magenta = "#b8a8d0"
brown = "#5c5c5c"

bright_red = "#e0a8a8"
bright_yellow = "#e3d9b0"
bright_green = "#b6d3af"
bright_cyan = "#a6d6f0"
bright_blue = "#b5e2ff"
bright_magenta = "#c8b8e0"
