# Nanuk — foot (terminal por defecto).
# Negro/blanco/gris. ANSI con tinte mínimo (para distinguir diffs).
# Colores sin '#'.  man 5 foot.ini
#
# foot 1.28 partió [colors] en [colors-dark] / [colors-light]. Nanuk es
# siempre oscuro, así que ponemos la MISMA paleta en las dos: da igual lo
# que pida el portal del sistema, foot siempre pinta Nanuk.

font=CaskaydiaMono Nerd Font:size=11
pad=8x8

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[key-bindings]
# Shift+Insert es por defecto 'primary-paste'; lo liberamos para usarlo
# como pegar del portapapeles (igual que en el resto de Nanuk).
primary-paste=none
clipboard-paste=Control+Shift+v Shift+Insert
clipboard-copy=Control+Shift+c Control+Insert

[colors-dark]
alpha=1.0
background=000000
foreground=ffffff
cursor=000000 9fd8ff
selection-background=1e1e1e
selection-foreground=ffffff
regular0=000000
regular1=b0a0a0
regular2=a0b0a0
regular3=b0b0a0
regular4=a0a8b0
regular5=b0a0b0
regular6=a0b0b0
regular7=d8d8d8
bright0=707070
bright1=c8b8b8
bright2=b8c8b8
bright3=c8c8b8
bright4=b8c0c8
bright5=c8b8c8
bright6=b8c8c8
bright7=ffffff

[colors-light]
