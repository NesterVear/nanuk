# Nanuk — foot (terminal por defecto).
# Colores sin '#', como pide foot. Paleta: themes/nanuk/colors.toml
# Referencia: man 5 foot.ini

font=CaskaydiaMono Nerd Font:size=11
pad=14x14

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
alpha=1.0
background=000000
foreground=ffffff
selection-background=10202a
selection-foreground=ffffff

regular0=000000
regular1=d19a9a
regular2=a7c4a0
regular3=d6cba0
regular4=9fd8ff
regular5=b8a8d0
regular6=8ec9e8
regular7=ffffff

bright0=7a7a7a
bright1=e0a8a8
bright2=b6d3af
bright3=e3d9b0
bright4=b5e2ff
bright5=c8b8e0
bright6=a6d6f0
bright7=ffffff

[key-bindings]
# Shift+Insert / Ctrl+Insert como en el resto de Nanuk.
clipboard-paste=Control+Shift+v Shift+Insert
clipboard-copy=Control+Shift+c Control+Insert
