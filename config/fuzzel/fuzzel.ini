# Nanuk — launcher (fuzzel).  man 5 fuzzel.ini
# Negro con borde gris de 1 px; selección blanca sobre gris oscuro. Sin
# iconos, sin esquinas, sin color.
#
# Por qué fuzzel y no wofi: wofi es GTK3 y se dibuja dos veces (abre, calcula
# el alto de las filas y se redimensiona), y al filtrar vuelve a encoger y
# crecer. fuzzel pinta él mismo con su tamaño final desde el primer frame.
# Lo usan también el menú de energía, la chuleta de atajos y el portapapeles
# (en modo --dmenu).

[main]
font=CaskaydiaMono Nerd Font:size=10
dpi-aware=no
prompt="❯ "
icons-enabled=no
match-mode=fzf
# Las apps se lanzan como unidades de systemd de usuario, igual que los atajos.
launch-prefix=uwsm-app --
terminal=kitty
anchor=center
width=48
lines=9
horizontal-pad=12
vertical-pad=12
inner-pad=8
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=000000ff
text=b0b0b0ff
message=707070ff
prompt=707070ff
placeholder=505050ff
input=ffffffff
match=ffffffff
selection=141414ff
selection-text=ffffffff
selection-match=ffffffff
counter=505050ff
border=333333ff

[border]
width=1
radius=0
selection-radius=0
