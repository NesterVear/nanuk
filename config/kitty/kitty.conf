# Nanuk — kitty (terminal por defecto, SUPER+RETURN).
# Negro/blanco/gris; ANSI con tinte mínimo para distinguir diffs.
# https://sw.kovidgoyal.net/kitty/conf/

font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

window_padding_width  8
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape     block
cursor_blink_interval 0

background            #000000
foreground            #ffffff
cursor                #9fd8ff
cursor_text_color     #000000
selection_background  #1e1e1e
selection_foreground  #ffffff
url_color             #b0b0b0

active_tab_background   #000000
active_tab_foreground   #ffffff
inactive_tab_background #000000
inactive_tab_foreground #707070

color0  #000000
color1  #b0a0a0
color2  #a0b0a0
color3  #b0b0a0
color4  #a0a8b0
color5  #b0a0b0
color6  #a0b0b0
color7  #d8d8d8
color8  #707070
color9  #c8b8b8
color10 #b8c8b8
color11 #c8c8b8
color12 #b8c0c8
color13 #c8b8c8
color14 #b8c8c8
color15 #ffffff

map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
