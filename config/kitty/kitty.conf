# Nanuk — kitty (terminal alternativa, SUPER+CTRL+RETURN).
# Misma paleta que foot para comparar solo el renderizado y las features.
# Referencia: https://sw.kovidgoyal.net/kitty/conf/

font_family      CaskaydiaMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

window_padding_width  14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no

cursor_shape     block
cursor_blink_interval 0

background            #000000
foreground            #ffffff
cursor                #ffffff
cursor_text_color     #000000
selection_background  #10202a
selection_foreground  #ffffff
url_color             #9fd8ff

# Pestañas (si las usas): negras, la activa en hielo.
active_tab_background   #000000
active_tab_foreground   #9fd8ff
inactive_tab_background #000000
inactive_tab_foreground #7a7a7a

color0  #000000
color1  #d19a9a
color2  #a7c4a0
color3  #d6cba0
color4  #9fd8ff
color5  #b8a8d0
color6  #8ec9e8
color7  #ffffff
color8  #7a7a7a
color9  #e0a8a8
color10 #b6d3af
color11 #e3d9b0
color12 #b5e2ff
color13 #c8b8e0
color14 #a6d6f0
color15 #ffffff

map shift+insert paste_from_clipboard
map ctrl+insert  copy_to_clipboard
