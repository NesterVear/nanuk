# Nanuk — prompt (starship). Una línea, gris y blanco.
# Al principio, un indicador del comando anterior: ● hielo si salió bien, ✖ en
# rojo suave si falló. Solo aparece cuando YA se ejecutó algo: en el primer
# prompt de la shell todavía no hay comando del que informar, así que queda
# solo el directorio. Al final, la flecha ❯ de siempre.
# https://starship.rs/config/
#
# El estado lo pasa bash (config/bash/rc): un hook en starship_precmd_user_func
# exporta NANUK_CMD_RAN y NANUK_CMD_STATUS justo antes de dibujar el prompt.

add_newline = true
command_timeout = 3000
# ${custom.*} y no $custom: fijamos el orden (el indicador primero) y que aquí
# solo entren esos dos módulos nuestros.
format = "${custom.nanuk_ok}${custom.nanuk_err}[$directory$git_branch$git_status]($style)$python[❯](bold white) "

# Indicador del prompt, en dos módulos (uno por estado) para dar a cada símbolo
# su color. `when` decide si se muestran y `command` no imprime nada (el símbolo
# va en `format`). Ojo: un módulo custom sin `when` no se muestra nunca (el
# valor por defecto es false).
[custom.nanuk_ok]
when = 'test "${NANUK_CMD_RAN:-0}" = 1 && test "${NANUK_CMD_STATUS:-0}" = 0'
command = "true"
symbol = "●"
style = "bold #9fd8ff"
format = "[$symbol]($style) "

[custom.nanuk_err]
when = 'test "${NANUK_CMD_RAN:-0}" = 1 && test "${NANUK_CMD_STATUS:-0}" != 0'
command = "true"
symbol = "✖"
style = "bold #d19a9a"
format = "[$symbol]($style) "

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "#909090"
repo_root_style = "bold white"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #909090"

# Entorno virtual de Python. starship reescribe PS1 en cada prompt, así que
# el "(venv)" que añade `source .venv/bin/activate` se pierde; este módulo lo
# vuelve a pintar. Con las listas de detección vacías SOLO aparece cuando hay
# un venv activo (no en cada carpeta con un .py).
[python]
format = '[(\($virtualenv\) )]($style)'
style = "#b0b0b0"
detect_extensions = []
detect_files = []
detect_folders = []

[git_status]
format     = '[$all_status]($style)'
style      = "#b0b0b0"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
