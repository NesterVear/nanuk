# Nanuk — prompt (starship). Una línea, gris y blanco.
# Al principio, un indicador del ÚLTIMO comando: ● hielo si salió bien, ✖ en
# rojo suave si falló. Al final, la flecha ❯ de siempre.
# https://starship.rs/config/

add_newline = true
command_timeout = 3000
# $character va PRIMERO (el indicador) y al final la flecha ❯ fija. Ojo: el
# módulo character ya añade el espacio de después, no se pone otro.
format = "$character[$directory$git_branch$git_status]($style)$python[❯](bold white) "

[character]
success_symbol = "[●](bold #9fd8ff)"
error_symbol = "[✖](bold #d19a9a)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "#909090"
repo_root_style = "bold white"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #909090"

# Entorno virtual de Python. starship reescribe PS1 en cada prompt, así que
# el "(venv)" que añade `source .venv/bin/activate` se pierde; este módulo lo
# vuelve a pintar. Con las listas de detección vacías SOLO aparece cuando hay
# un venv activo (no en cada carpeta con un .py).
[python]
format = '[(\($virtualenv\) )]($style)'
style = "#b0b0b0"
detect_extensions = []
detect_files = []
detect_folders = []

[git_status]
format     = '[$all_status]($style)'
style      = "#b0b0b0"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
