# Nanuk — prompt (starship). Una línea, gris y blanco, sin color.
# https://starship.rs/config/

add_newline = true
command_timeout = 3000
format = "[$directory$git_branch$git_status]($style)$character"

[character]
success_symbol = "[❯](bold white)"
error_symbol = "[❯](bold #707070)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "#909090"
repo_root_style = "bold white"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #909090"

[git_status]
format     = '[$all_status]($style)'
style      = "#b0b0b0"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = ""
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
