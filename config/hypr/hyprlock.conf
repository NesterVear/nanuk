# Nanuk — pantalla de bloqueo (hyprlock).
# El mismo wordmark que el splash de arranque (lock.png del tema activo,
# ~/.config/nanuk/theme), negro puro, y el campo de contraseña justo debajo,
# con el mismo borde de hielo que dibuja Plymouth.
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = false
}

# Fondo: lock.png del tema activo = negro con el wordmark centrado (58% del
# ancho), generado por themes/nanuk/build-assets.sh. hyprlock lo escala en
# modo "cover", así que se ve igual en 1366x768, 1080p, 4K o 16:10.
# (No se usa el widget `image`: escala por el lado menor y recorta en
# cuadrado, y el wordmark ancho salía como una "A" gigante.)
background {
    monitor =
    color = rgb(000000)
    path = ~/.config/nanuk/theme/lock.png
}

# Campo de contraseña: 420x52, borde de hielo de 2 px, como entry.png del
# splash. Posición en % de la pantalla: su centro al 22% por debajo del
# centro, justo bajo el wordmark en cualquier resolución.
input-field {
    monitor =
    size = 420, 52
    position = 0, -22%
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgb(9fd8ff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    font_family = CaskaydiaMono Nerd Font
    check_color = rgb(9fd8ff)
    fail_color = rgb(b0a0a0)

    placeholder_text =
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
