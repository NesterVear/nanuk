# Nanuk — pantalla de bloqueo (hyprlock).
# La MISMA imagen que el splash de arranque: wordmark.png del tema activo
# (~/.config/nanuk/theme), negro puro, y el campo de contraseña justo
# debajo, con el mismo borde de hielo que dibuja Plymouth.
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(000000)
}

# Wordmark (la misma imagen que usa Plymouth, ver themes/nanuk/build-assets.sh).
# `size` es el lado MAYOR en píxeles: 850 px de ancho ≈ el 62% de una pantalla
# de 1366 px, igual que en el splash (que sí puede escalar por pantalla; aquí
# hyprlock no sabe el ancho del monitor). La imagen es 1400x380, así que
# queda en 850x231. Súbelo si tu pantalla es más grande.
image {
    monitor =
    path = ~/.config/nanuk/theme/wordmark.png
    size = 850
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# Campo de contraseña: 420x52, borde de hielo de 2 px, como entry.png del
# splash. En Plymouth va 40 px por debajo del logo; aquí igual:
# mitad del logo (115) + 40 + mitad del campo (26) = 181 px bajo el centro.
input-field {
    monitor =
    size = 420, 52
    position = 0, -181
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgb(9fd8ff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    font_family = CaskaydiaMono Nerd Font
    check_color = rgb(9fd8ff)
    fail_color = rgb(b0a0a0)

    placeholder_text =
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
