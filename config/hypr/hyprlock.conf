# Nanuk — pantalla de bloqueo (hyprlock).
# Negro puro, el nombre, y un campo de contraseña con borde de hielo.
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    ignore_empty_input = true
    hide_cursor = true
}

animations {
    enabled = false
}

background {
    monitor =
    color = rgb(000000)
}

label {
    monitor =
    text = NANUK
    font_family = iA Writer Quattro S
    font_size = 42
    color = rgb(ffffff)
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 420, 52
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 1
    outer_color = rgb(9fd8ff)
    inner_color = rgb(000000)
    font_color = rgb(ffffff)
    font_family = CaskaydiaMono Nerd Font
    check_color = rgb(9fd8ff)
    fail_color = rgb(d19a9a)

    placeholder_text =
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
