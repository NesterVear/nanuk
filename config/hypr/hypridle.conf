# Nanuk — inactividad (hypridle).
# 10 min → bloquear; 15 min → apagar pantalla; al dormir → bloquear antes.
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = pidof hyprlock || hyprlock       # no lanzar dos hyprlock
    before_sleep_cmd = loginctl lock-session    # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on  # encender pantalla al volver
    inhibit_sleep = 3                           # esperar a que el lock esté puesto
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
